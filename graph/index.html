
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <style>
            :root {
                color-scheme: dark;
                --bg: #0b1020;
                --panel: rgba(17, 25, 45, .88);
                --panel-border: rgba(148, 163, 184, .18);
                --text: #eef2ff;
                --muted: #9aa8c2;
                --accent: #8b9cff;
                --accent-2: #67e8f9;
            }

            * { box-sizing: border-box; }
            html, body { width: 100%; height: 100%; }
            body {
                margin: 0;
                overflow: hidden;
                color: var(--text);
                background:
                    radial-gradient(circle at 15% 0%, rgba(80, 103, 255, .16), transparent 34%),
                    radial-gradient(circle at 90% 100%, rgba(38, 198, 218, .10), transparent 32%),
                    var(--bg);
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            #graph-shell, #graph, svg { width: 100%; height: 100%; }
            #graph-shell { position: relative; isolation: isolate; }
            svg { display: block; cursor: grab; }
            svg:active { cursor: grabbing; }

            .toolbar, .details, .hint {
                position: absolute;
                z-index: 2;
                border: 1px solid var(--panel-border);
                background: var(--panel);
                box-shadow: 0 16px 40px rgba(0, 0, 0, .28);
                backdrop-filter: blur(16px);
            }
            .toolbar {
                top: 16px;
                left: 16px;
                right: 16px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 10px;
                border-radius: 16px;
            }
            .brand { margin: 0 10px 0 4px; font-size: 14px; font-weight: 750; letter-spacing: .02em; white-space: nowrap; }
            .brand span { color: var(--accent-2); }
            .search-wrap { position: relative; flex: 1 1 220px; min-width: 180px; }
            .search-wrap input {
                width: 100%;
                border: 1px solid rgba(148, 163, 184, .22);
                border-radius: 10px;
                padding: 9px 12px 9px 34px;
                color: var(--text);
                background: rgba(255, 255, 255, .06);
                outline: none;
                font: inherit;
                font-size: 13px;
            }
            .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 156, 255, .16); }
            .search-icon { position: absolute; left: 12px; top: 8px; color: var(--muted); pointer-events: none; }
            button, .range-wrap {
                border: 1px solid rgba(148, 163, 184, .18);
                border-radius: 10px;
                color: var(--text);
                background: rgba(255, 255, 255, .06);
                font: inherit;
                font-size: 12px;
            }
            button { cursor: pointer; padding: 9px 11px; transition: .18s ease; }
            button:hover, button[aria-pressed="true"] { border-color: rgba(139, 156, 255, .7); background: rgba(139, 156, 255, .16); }
            .range-wrap { display: flex; align-items: center; gap: 7px; padding: 6px 10px; color: var(--muted); white-space: nowrap; }
            input[type="range"] { width: 76px; accent-color: var(--accent); }
            .stats { flex-basis: 100%; color: var(--muted); font-size: 11px; padding: 2px 4px 0; }
            .details { right: 16px; bottom: 58px; width: min(280px, calc(100% - 32px)); padding: 14px; border-radius: 14px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
            .details.visible { opacity: 1; transform: translateY(0); }
            .details h2 { margin: 0 0 7px; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
            .details p { margin: 4px 0; color: var(--muted); font-size: 12px; }
            .details strong { color: var(--text); font-weight: 650; }
            .hint { left: 16px; bottom: 16px; padding: 7px 10px; border-radius: 9px; color: var(--muted); font-size: 11px; }
            .link { stroke: #8491b2; stroke-opacity: .22; stroke-width: 1; transition: .2s ease; }
            .link.is-active { stroke: var(--accent-2); stroke-opacity: .82; stroke-width: 2; }
            .node { cursor: pointer; stroke: rgba(255,255,255,.76); stroke-width: 1.3; transition: opacity .2s ease; }
            .node:hover { stroke: #fff; stroke-width: 2.4; }
            .node.is-selected { stroke: #fff; stroke-width: 3; filter: drop-shadow(0 0 8px rgba(139, 156, 255, .8)); }
            .node.is-hidden, .text.is-hidden, .link.is-hidden { opacity: .06; }
            .text { fill: #dfe7ff; font-size: 11px; font-weight: 550; paint-order: stroke; stroke: rgba(11,16,32,.9); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; transition: opacity .2s ease; }
            .text.is-muted { opacity: .16; }
            .tooltip { position: fixed; z-index: 4; pointer-events: none; padding: 8px 10px; border: 1px solid var(--panel-border); border-radius: 8px; color: var(--text); background: rgba(8, 12, 25, .94); box-shadow: 0 10px 26px rgba(0,0,0,.28); font-size: 12px; opacity: 0; transform: translate(10px, 10px); transition: opacity .12s ease; }
            .tooltip.visible { opacity: 1; }
            @media (max-width: 640px) {
                .toolbar { top: 8px; left: 8px; right: 8px; padding: 8px; }
                .brand { flex-basis: 100%; margin-bottom: 2px; }
                .hint { left: 8px; bottom: 8px; }
                .details { right: 8px; bottom: 48px; }
            }
        </style>
    </head>

                    var tx = width / 2 - scale * (x0 + x1) / 2;
                    var ty = height / 2 - scale * (y0 + y1) / 2;
                    svg.transition().duration(550).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
                }

                function resetGraph() {
                    selected = null;
                    searchTerm = "";
                    minDegree = 0;
                    document.getElementById("search").value = "";
                    document.getElementById("degree").value = "0";
                    graphNodes.forEach(function (d) { d.fx = null; d.fy = null; });
                    simulation.alpha(1).restart();
                    svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity);
                    updateView();
                }

                function escapeHtml(value) {
                    return String(value).replace(/[&<>'"]/g, function (character) {
                        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character];
                    });
                }

                function resize() {
                    width = shell.clientWidth || window.innerWidth;
                    height = shell.clientHeight || window.innerHeight;
                    svg.attr("width", width).attr("height", height).attr("viewBox", "0 0 " + width + " " + height);
                    simulation.force("x", d3.forceX(width / 2).strength(.035)).force("y", d3.forceY(height / 2).strength(.035));
                    simulation.alpha(.25).restart();
                }

                node.on("click", function (d) { focusNode(d); })
                    .on("keydown", function (d) { if (d3.event.key === "Enter" || d3.event.key === " ") { d3.event.preventDefault(); focusNode(d); } })
                    .on("mouseenter", function (d) {
                        var tooltip = document.getElementById("tooltip");
                        tooltip.textContent = d.label + " · " + (d.link_count || 0) + " links";
                        tooltip.classList.add("visible");
                    })
                    .on("mousemove", function () {
                        var event = d3.event, tooltip = document.getElementById("tooltip");
                        tooltip.style.left = (event.clientX + 12) + "px";
                        tooltip.style.top = (event.clientY + 12) + "px";
                    })
                    .on("mouseleave", function () { document.getElementById("tooltip").classList.remove("visible"); });

                node.call(d3.drag().on("start", function (d) {
                    if (!d3.event.active) simulation.alphaTarget(.25).restart();
                    d.fx = d.x; d.fy = d.y;
                }).on("drag", function (d) {
                    d.fx = d3.event.x; d.fy = d3.event.y;
                }).on("end", function (d) {
                    if (!d3.event.active) simulation.alphaTarget(0);
                    d.fx = null; d.fy = null;
                }));

                document.getElementById("search").addEventListener("input", function (event) {
                    searchTerm = event.target.value.trim().toLowerCase(); updateView();
                });
                document.getElementById("degree").addEventListener("input", function (event) {
                    minDegree = +event.target.value; updateView();
                });
                document.getElementById("labels").addEventListener("click", function (event) {
                    labelsOn = !labelsOn; event.currentTarget.setAttribute("aria-pressed", labelsOn); updateView();
                });
                document.getElementById("pause").addEventListener("click", function (event) {
                    paused = !paused;
                    if (paused) simulation.stop(); else simulation.alpha(.25).restart();
                    event.currentTarget.textContent = paused ? "Resume" : "Pause";
                    event.currentTarget.setAttribute("aria-pressed", paused);
                });
                document.getElementById("reset").addEventListener("click", resetGraph);
                document.getElementById("fit").addEventListener("click", fitGraph);
                window.addEventListener("keydown", function (event) { if (event.key === "Escape") { selected = null; updateView(); } });
                if (window.ResizeObserver) new ResizeObserver(resize).observe(shell); else window.addEventListener("resize", resize);

                updateView();
                setTimeout(fitGraph, 900);
            }());
        </script>
    </body>
    </html>
